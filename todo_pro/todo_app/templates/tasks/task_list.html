<h1>Todo List</h1>
<a href="{% url 'task_create' %}">Yangi Vazifa Qo‘shish</a>
<ul>
    {% for task in tasks %}
        <li>
            {{ task.title }} - {{ task.completed }}
            <a href="{% url 'task_update' task.id %}">Tahrirlash</a>
            <a href="{% url 'task_delete' task.id %}">O‘chirish</a>
        </li>
    {% endfor %}
</ul>
